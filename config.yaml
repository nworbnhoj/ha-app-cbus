name: "C-Bus Bridge"
arch:
  - aarch64
  - amd64
description: "Control a Clipsal C-Bus wired building via this C-Bus to MQTT bridge."
version: "0.0.1"
slug: "cbus2mqtt"
init: false
image: "ghcr.io/nworbnhoj/ha-app-cbus"
url: "https://github.com/nworbnhoj/ha-app-cbus"
devices:
  - /dev/tty*
options:
  device:
    serial: ""
  mqtt:
    host: "core-mosquitto"
    port: "1883"
    username:
    password:
  ssl:
    cert: ""
    key: ""
schema:
  device:
    serial: device(subsystem=tty)
  mqtt:
    host: str
    port: list(1883|1884)
    username: str
    password: password
  ssl:
    cert: str
    key: str